name: Trident CI/CD & Zero-CORS Verification

on:
  push:
    branches: [ "main", "feature-voice-assistant", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔍 Python Syntax & Config Audit
        run: |
          python -m py_compile backend/main.py backend/config.py backend/database.py

      - name: 🐳 Validate Docker Compose Config
        run: |
          docker compose config

      - name: 🏗️ Build Docker Containers
        run: |
          docker compose build --parallel

      - name: 🚀 Start Services & Wait for Healthchecks
        run: |
          # Start containers and wait up to 120s for healthchecks to pass
          docker compose up -d --wait --wait-timeout 120 || {
            echo "Container startup timed out or failed. Displaying container logs:"
            docker compose logs
            docker compose ps
            exit 1
          }

      - name: 🩺 Smoke Test & Zero-CORS Handshake Check
        run: |
          echo "=== 1. Checking Gateway Root HTTP Status (Port 80) ==="
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || true)
            echo "Attempt $i: Gateway status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Gateway is UP and healthy!"
              break
            fi
            sleep 3
          done

          echo "=== 2. Checking Direct Backend Health (Port 8000) ==="
          curl -f http://localhost:8000/

          echo "=== 3. Checking Zero-CORS Preflight Handshake ==="
          curl -s -I -X OPTIONS http://localhost/api/v1/process-document \
            -H "Origin: http://localhost:3000" \
            -H "Access-Control-Request-Method: POST" | grep -i "Access-Control-Allow-Origin"

          echo "=== 4. Checking API Swagger Docs ==="
          curl -f -I http://localhost/docs

      - name: 🛑 Teardown Stack
        if: always()
        run: |
          docker compose down -v
